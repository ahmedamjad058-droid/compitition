<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Featured - Ocean Legacy Miniatures</title>
<style>
/* ===== Base + site theme (copied from style.css so this page is fully self-contained) ===== */
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',sans-serif}
:root{--gold:#c9a86a;--ink:#e9e3d3;--mute:rgba(233,227,211,.66);--navy:#010a18;--navy2:#081a33;--site:#0a1931;--nav:64px}
body{background:#f8f6f1;color:#1a1a1a}
.navbar{display:flex;justify-content:space-between;align-items:center;padding:20px 5%;background:var(--site);color:#fff;position:sticky;top:0;z-index:100}
.logo{font-weight:800;letter-spacing:2px;font-size:18px}
.logo span{font-weight:300;color:var(--gold)}
.navbar nav a{color:#fff;text-decoration:none;margin-left:25px;font-size:14px;opacity:.8}
.navbar nav a.active,.navbar nav a:hover{opacity:1;color:var(--gold)}
.page-header{padding:70px 5%;background:var(--site);color:#fff;text-align:center}
.page-header h1{font-size:48px}
.page-header p{opacity:.7;margin-top:10px}
footer{padding:30px;text-align:center;background:var(--site);color:#fff;font-size:13px}
.btn-small{display:inline-block;margin-top:15px;padding:8px 15px;background:var(--gold);color:var(--site);text-decoration:none;font-size:12px;font-weight:700}
@media(max-width:768px){.navbar{flex-direction:column;gap:10px}.navbar nav a{margin:0 10px}.page-header h1{font-size:34px}}

/* ===== Featured showcase ===== */
#bar{position:fixed;top:0;left:0;width:100%;height:3px;background:var(--gold);transform:scaleX(0);transform-origin:0 50%;z-index:200;will-change:transform}
.showcase{background:linear-gradient(180deg,var(--navy) 0%,var(--navy2) 100%);color:var(--ink)}
.featured{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:2vw;padding:0 4vw}
.stage{position:sticky;top:var(--nav);height:calc(100vh - var(--nav));display:grid;place-items:center}
.card{position:relative;width:100%;height:min(82vh,calc(100vh - var(--nav) - 24px));overflow:hidden;cursor:pointer;border:1px solid rgba(201,168,106,.4);background:#020d1f;box-shadow:0 40px 80px -30px rgba(0,0,0,.8),inset 0 0 0 6px #020d1f,inset 0 0 0 7px rgba(201,168,106,.18);outline-offset:4px}
.card:focus-visible{outline:2px solid var(--gold)}

/* Slide: 60% image / 40% text */
.slide{position:absolute;inset:0;display:grid;grid-template-rows:60% 40%;opacity:0;visibility:hidden}
.slide.on{opacity:1;visibility:visible}
.media{position:relative;overflow:hidden;background:var(--site)}
.m{position:absolute;inset:0;will-change:transform;transform:scale(1.05)}
.m img,.m video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.slide.on .m{animation:bob 5s ease-in-out infinite} /* POST-WASH: floating on water */
@keyframes bob{0%,100%{transform:scale(1.05) translateY(0) rotate(0)}50%{transform:scale(1.05) translateY(-4px) rotate(.6deg)}}
.sinfo{padding:clamp(16px,3vh,32px) clamp(20px,3vw,40px);display:flex;flex-direction:column;justify-content:space-between;border-top:1px solid rgba(201,168,106,.35)}
.sinfo h3{font-size:clamp(28px,3.4vw,46px);line-height:1.05}
.sub{font-size:clamp(14px,1.3vw,17px);color:var(--gold);margin-top:4px}
.specs{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid rgba(201,168,106,.25)}
.specs div{padding:12px 0 0}
.specs div+div{padding-left:14px;border-left:1px solid rgba(201,168,106,.25)}
.specs dt{font-size:12px;color:var(--mute)}
.specs dd{font-size:clamp(14px,1.3vw,18px);font-weight:700;line-height:1.3}
.count,#snd{position:absolute;top:14px;z-index:6;font-size:12px;color:var(--ink);background:rgba(1,10,24,.6);padding:3px 10px;border:1px solid rgba(201,168,106,.4)}
.count{right:16px}
#snd{left:16px;cursor:pointer}
#snd:focus-visible{outline:2px solid var(--gold)}

/* ===== ROUND WASH: clip-path circle + 4 ocean layers + particles + ripples ===== */
.water{position:absolute;inset:0;z-index:5;display:none;clip-path:circle(0% at 50% 50%);pointer-events:none;overflow:hidden;background:var(--navy)}
.water.run{display:block}
.lyr{position:absolute;inset:-50%;will-change:transform;animation:spin linear infinite;animation-play-state:paused}
.run .lyr,.run .pt,.run .ring{animation-play-state:running}
@keyframes spin{to{transform:rotate(360deg)}}
.l1{background:radial-gradient(circle at 28% 32%,#052250 0,transparent 42%),radial-gradient(circle at 72% 70%,#031a40 0,transparent 40%),#010a18;animation-duration:8s}
.l2{background:radial-gradient(ellipse at 35% 62%,rgba(10,60,120,.6),transparent 52%),radial-gradient(ellipse at 70% 28%,rgba(10,60,120,.6),transparent 48%);animation-duration:5s;animation-direction:reverse}
.l3{background:radial-gradient(ellipse at 62% 58%,rgba(20,140,200,.5),transparent 46%),radial-gradient(ellipse at 24% 30%,rgba(20,140,200,.5),transparent 40%);animation-duration:3.5s}
.l4{background:radial-gradient(circle at 20% 68%,rgba(255,255,255,.55),transparent 12%),radial-gradient(circle at 68% 24%,rgba(255,255,255,.5),transparent 10%),radial-gradient(circle at 80% 78%,rgba(255,255,255,.45),transparent 13%),radial-gradient(circle at 42% 44%,rgba(255,255,255,.35),transparent 9%);animation-duration:2s}
.ring{position:absolute;left:30%;top:30%;width:40%;aspect-ratio:1;border-radius:50%;border:2px solid rgba(255,255,255,.6);opacity:0;animation:ripple 1.8s ease-out infinite;animation-play-state:paused;will-change:transform,opacity}
.ring:nth-of-type(2){animation-delay:.45s}.ring:nth-of-type(3){animation-delay:.9s}
@keyframes ripple{0%{transform:scale(.15);opacity:.9}100%{transform:scale(3.4);opacity:0}}
.pt{position:absolute;border-radius:50%;animation:drift ease-in-out infinite alternate;animation-play-state:paused;will-change:transform}
@keyframes drift{to{transform:translate3d(var(--dx),var(--dy),0)}}
.pt.deep{background:rgba(40,90,170,.45)}
.pt.mid{background:rgba(140,200,240,.65)}
.pt.top{background:#fff;box-shadow:0 0 6px rgba(255,255,255,.9)}

/* Right column: scroll sections */
.panel{min-height:calc(100vh - var(--nav));display:flex;align-items:center;padding:0 3vw;border-left:2px solid transparent;opacity:.25;transition:opacity .6s,border-color .6s,box-shadow .6s}
.panel.on{opacity:1;border-left-color:var(--gold);box-shadow:-14px 0 28px -20px rgba(201,168,106,.8)}
.panel .in{max-width:46ch}
.rv{opacity:0;transform:translateY(20px);transition:opacity .7s,transform .7s}
.panel.on .rv{opacity:1;transform:none}
.panel.on .rv:nth-child(2){transition-delay:.12s}.panel.on .rv:nth-child(3){transition-delay:.24s}.panel.on .rv:nth-child(4){transition-delay:.36s}
.era{color:var(--gold);font-size:16px;font-weight:600}
.panel h2{font-size:clamp(40px,5vw,72px);line-height:1;margin:6px 0 20px}
.panel p{color:var(--mute);margin-bottom:14px;line-height:1.7}
.cta{display:inline-block;margin:6px 10px 0 0;padding:12px 24px;border:1px solid var(--gold);color:var(--gold);text-decoration:none;font-size:14px;transition:background .3s,color .3s}
.cta:hover,.cta:focus-visible{background:var(--gold);color:var(--site);outline:none}

.more{padding:70px 5%;text-align:center;background:var(--site);color:#fff;border-top:1px solid rgba(201,168,106,.3)}
.more h3{font-size:34px;margin-bottom:10px}
.more p{opacity:.8;margin-bottom:6px}

@media(max-width:768px){
  .featured{display:block}
  .stage{height:60vh;z-index:10;background:var(--navy)}
  .card{height:calc(60vh - 12px)}
  .panel{min-height:40vh;padding:0 4vw}
  .panel h2{font-size:34px;margin-bottom:10px}
  .panel p{font-size:14px;margin-bottom:8px}
  .sinfo h3{font-size:24px}
}
@media(prefers-reduced-motion:reduce){.slide.on .m{animation:none}.rv{transition:none}}
</style>
</head>
<body>
<div id="bar"></div>

<header class="navbar" id="navbar">
    <div class="logo">OCEAN LEGACY <span>MINIATURES</span></div>
    <nav>
         <a href="index.html" >Home</a>
        <a href="featured.html" class="active">Featured</a>
        <a href="products.html">Products</a>
        <a href="about.html">About Us</a>
        <a href="contact.html">Contact</a>
    </nav>
</header>

<section class="page-header">
    <h1>Featured Ships</h1>
    <p>Premium handcrafted ship miniatures - our finest from every era</p>
</section>

<main class="showcase">
  <section class="featured" aria-label="Featured ships">
    <div class="stage">
      <div class="card" id="card" tabindex="0" role="button" aria-label="Featured ship card. Activate to replay the water wash.">
        <button id="snd" type="button" aria-pressed="false">Sound off</button>
        <div class="count" id="count"></div>
        <!-- ROUND WASH: water overlay (particles are added by JS) -->
        <div class="water" id="water" aria-hidden="true">
          <div class="lyr l1"></div><div class="lyr l2"></div><div class="lyr l3"></div><div class="lyr l4"></div>
          <i class="ring"></i><i class="ring"></i><i class="ring"></i>
        </div>
      </div>
    </div>
    <div class="panels" id="panels"></div>
  </section>

  <section class="more">
    <h3>See the full fleet</h3>
    <p>Every ship, by era, with prices.</p>
    <a href="products.html" class="btn-small">View All Ships</a>
  </section>
</main>

<footer><p>© 2026 Ocean Legacy Miniatures | Handcrafted with Legacy</p></footer>

<script>
(() => {
  // Featured ships (details and photos from your products page)
  const ships = [
    {id:'spanish-galleon', img:'a (1).jpg', name:'Spanish Galleon', era:'1588 · The Galleon Era', len:'18 inch', mat:'Teak', price:'Rs. 15,000',
     t:'The Spanish treasure ship, handcrafted in old teak with antique brass fittings.',
     t2:'We research the original blueprints before we build, so the hull and rigging stay true to the age.'},
    {id:'black-pearl', img:'a (4).jpg', name:'Black Pearl - Limited', era:'1715 · The Pirate Era', len:'20 inch', mat:'Old wood + black sail', price:'Rs. 18,000',
     t:'A limited-run pirate ship in old wood, with its black sail.',
     t2:'Around 500 hours of handwork go into every ship, and every one is 100% handmade.'},
    {id:'hms-victory', img:'a (2).jpg', name:'HMS Victory', era:'1805 · The Warship Era', len:'24 inch', mat:'Museum quality', price:'Rs. 25,000',
     t:"Nelson's flagship and the pride of the Royal Navy, built to museum quality.",
     t2:'Every sail, rope and cannon is researched from period blueprints and finished by hand.'}
  ];

  const card = document.getElementById('card'), water = document.getElementById('water'),
        panelsEl = document.getElementById('panels'), count = document.getElementById('count'),
        navbar = document.getElementById('navbar');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

  // Measure the real sticky navbar height so the card sits right below it
  const setNav = () => document.documentElement.style.setProperty('--nav', navbar.offsetHeight + 'px');
  setNav(); addEventListener('resize', setNav);

  // Build slides (inside the card, under the water) and text panels
  ships.forEach((s, i) => {
    const slide = document.createElement('article');
    slide.className = 'slide' + (i ? '' : ' on');
    slide.innerHTML = `<div class="media"><div class="m">
        <img src="${s.img}" alt="${s.name}">
        <video muted loop playsinline preload="metadata"${i ? '' : ' autoplay'}><source src="${s.id}.mp4" type="video/mp4" onerror="this.parentNode.remove()"></video>
      </div></div>
      <div class="sinfo"><div><h3>${s.name}</h3><div class="sub">${s.era}</div></div>
      <dl class="specs"><div><dt>Length</dt><dd>${s.len}</dd></div><div><dt>Material</dt><dd>${s.mat}</dd></div><div><dt>Price</dt><dd>${s.price}</dd></div></dl></div>`;
    card.insertBefore(slide, water);
    const p = document.createElement('section');
    p.className = 'panel' + (i ? '' : ' on'); p.dataset.i = i;
    p.innerHTML = `<div class="in"><div class="era rv">${s.era}</div><h2 class="rv">${s.name}</h2>
      <p class="rv">${s.t}</p><p class="rv">${s.t2}<br><a class="cta" href="contact.html">Ask about this model</a><a class="cta" href="products.html">All ships</a></p></div>`;
    panelsEl.appendChild(p);
  });
  const slides = [...card.querySelectorAll('.slide')], panels = [...document.querySelectorAll('.panel')];
  let cur = 0, busy = false, pending = null, soundOn = false, ctx = null;
  count.textContent = `1 / ${ships.length}`;

  // ROUND WASH LOGIC: 40 particles (deep = dim/slow, mid = light/medium, surface = white/fast)
  const kinds = [['deep', 14, 4, 8], ['mid', 8, 3, 6], ['top', 4, 2, 4]];
  for (let i = 0; i < 40; i++) {
    const [cls, dur, min, max] = kinds[i < 14 ? 0 : i < 28 ? 1 : 2];
    const p = document.createElement('i'), sz = min + Math.random() * (max - min);
    p.className = 'pt ' + cls;
    p.style.cssText = `left:${Math.random() * 96}%;top:${Math.random() * 96}%;width:${sz}px;height:${sz}px;` +
      `--dx:${(Math.random() - .5) * 90}px;--dy:${(Math.random() - .5) * 90}px;animation-duration:${dur * (.7 + Math.random() * .6)}s`;
    water.appendChild(p);
  }

  // Swap image + text while the water fully covers the card, so the cut is never seen
  function swap(i) {
    cur = i;
    slides.forEach((s, k) => {
      const on = k === i, v = s.querySelector('video');
      s.classList.toggle('on', on);
      if (v) on ? v.play().catch(() => {}) : v.pause();
    });
    count.textContent = `${i + 1} / ${ships.length}`;
  }

  // ROUND WASH LOGIC: circle grows 0 -> 150% from the centre, swap at ~55%, then the water fades out
  function wash(i) {
    if (busy) { pending = i; return; }
    busy = true; pending = null;
    if (reduce) { swap(i); busy = false; return; }
    const dur = 2200, at = r => `circle(${r}% at 50% 50%)`;
    water.classList.add('run');
    const a = water.animate([
      { clipPath: at(0), opacity: 1, offset: 0, easing: 'cubic-bezier(.25,.1,.3,1)' },
      { clipPath: at(85), opacity: 1, offset: .5, easing: 'ease-out' },
      { clipPath: at(150), opacity: 1, offset: .75 },
      { clipPath: at(150), opacity: 0, offset: 1 }
    ], { duration: dur, fill: 'forwards' });
    setTimeout(() => swap(i), dur * .55);
    splash();
    a.onfinish = () => {
      a.cancel(); water.classList.remove('run'); busy = false;
      if (pending !== null && pending !== cur) wash(pending);
    };
  }

  // Active-section detection (threshold 0.6). On mobile the sticky card hides the top 60% of the screen.
  const mobile = matchMedia('(max-width: 768px)');
  let io;
  function observe() {
    if (io) io.disconnect();
    const nav = navbar.offsetHeight, top = mobile.matches ? Math.round(innerHeight * .6 + nav) : nav;
    io = new IntersectionObserver(es => es.forEach(e => {
      if (!e.isIntersecting) return;
      const i = +e.target.dataset.i;
      panels.forEach((p, k) => p.classList.toggle('on', k === i));
      if (i !== cur) wash(i);
    }), { threshold: .6, rootMargin: `-${top}px 0px 0px 0px` });
    panels.forEach(p => io.observe(p));
  }
  observe(); mobile.addEventListener('change', observe);

  // Click the card (or press Enter/Space) to replay the wash
  card.addEventListener('click', e => { if (e.target.id !== 'snd') wash(cur); });
  card.addEventListener('keydown', e => { if ((e.key === 'Enter' || e.key === ' ') && e.target === card) { e.preventDefault(); wash(cur); } });

  // Optional splash sound (off by default)
  document.getElementById('snd').addEventListener('click', e => {
    soundOn = !soundOn;
    e.target.textContent = soundOn ? 'Sound on' : 'Sound off';
    e.target.setAttribute('aria-pressed', soundOn);
    if (soundOn) { ctx = ctx || new (window.AudioContext || window.webkitAudioContext)(); ctx.resume(); splash(); }
  });
  function splash() {
    if (!soundOn || !ctx) return;
    const n = ctx.createBuffer(1, ctx.sampleRate * .6, ctx.sampleRate), d = n.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / d.length);
    const src = ctx.createBufferSource(), f = ctx.createBiquadFilter(), g = ctx.createGain(), t = ctx.currentTime;
    src.buffer = n; f.type = 'lowpass'; f.frequency.setValueAtTime(1800, t); f.frequency.exponentialRampToValueAtTime(300, t + .6);
    g.gain.setValueAtTime(.12, t); g.gain.exponentialRampToValueAtTime(.001, t + .6);
    src.connect(f); f.connect(g); g.connect(ctx.destination); src.start();
  }

  // Top gold scroll progress bar (transform only)
  const bar = document.getElementById('bar'); let tick = false;
  function prog() {
    const h = document.documentElement;
    bar.style.transform = `scaleX(${Math.min(1, h.scrollTop / Math.max(1, h.scrollHeight - h.clientHeight))})`;
    tick = false;
  }
  addEventListener('scroll', () => { if (!tick) { tick = true; requestAnimationFrame(prog); } }, { passive: true });
  prog();
})();
</script>
</body>
</html>
